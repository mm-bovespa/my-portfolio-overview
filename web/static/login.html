<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Portfolio Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#0f1419', card: '#1a2332', line: '#2a3544', muted: '#8b9cb3' },
            accent: { DEFAULT: '#3b82f6' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #0b0f14; color: #e7eef7; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <p class="text-accent text-xs font-semibold tracking-widest uppercase mb-2">my-portfolio-overview</p>
      <h1 class="text-2xl font-bold tracking-tight">Dashboard login</h1>
      <p class="text-surface-muted text-sm mt-2">Enter your password to view portfolio data.</p>
    </div>

    <form id="login-form" class="bg-surface-card border border-surface-line rounded-2xl p-6 shadow-xl space-y-5">
      <div>
        <label for="password" class="block text-sm font-medium text-surface-muted mb-1.5">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
          class="w-full rounded-lg border border-surface-line bg-[#0b0f14] px-3 py-2.5 text-sm text-white outline-none focus:border-accent focus:ring-1 focus:ring-accent"
          placeholder="••••••••••••"
        />
      </div>

      <div id="error" class="hidden rounded-lg border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300"></div>

      <button
        type="submit"
        id="btn-submit"
        class="w-full rounded-lg bg-accent hover:bg-blue-500 px-4 py-2.5 text-sm font-semibold text-white transition disabled:opacity-60"
      >
        Sign in
      </button>
    </form>

    <p class="text-center text-xs text-surface-muted mt-6 leading-relaxed">
      Password is checked only on this machine.<br />
      Hash stored in <span class="text-slate-400">.local/auth.json</span> (not in git).
    </p>
  </div>

  <script>
    (async function () {
      // Already logged in?
      try {
        const st = await fetch('/api/auth/status', { credentials: 'same-origin' });
        const j = await st.json();
        if (j.authenticated) {
          location.replace('/');
          return;
        }
      } catch (_) {}

      const form = document.getElementById('login-form');
      const err = document.getElementById('error');
      const btn = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.classList.add('hidden');
        btn.disabled = true;
        const password = document.getElementById('password').value;
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            err.textContent = data.error === 'invalid password'
              ? 'Wrong password. Try again.'
              : (data.error || 'Login failed.');
            err.classList.remove('hidden');
            btn.disabled = false;
            return;
          }
          location.replace(data.redirect || '/');
        } catch (ex) {
          err.textContent = 'Network error. Is the server running?';
          err.classList.remove('hidden');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
